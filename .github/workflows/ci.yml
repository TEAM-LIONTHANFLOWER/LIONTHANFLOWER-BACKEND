name: CI (Gradle)

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  gradle:
    name: ci-gradle
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: ${{ secrets.DEV_DB_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.DEV_DB_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Check formatting and build
        run: ./gradlew spotlessCheck build

      - name: Publish CI summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## CI (Gradle)"
            echo "- Status: ${JOB_STATUS}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Event: ${GITHUB_EVENT_NAME}"

            if [ "${JOB_STATUS}" = "failure" ]; then
              printf '\n### Next steps\n'
              echo "- 확인: 'Check formatting and build' 로그에서 첫 실패 원인을 찾아 수정"
              echo "- 재시도: 문제 해결 후 PR 업데이트 또는 workflow rerun"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
