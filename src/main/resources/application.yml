spring:
  application:
    name: lionthanflower-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  customer-api-security:
    enabled: ${CUSTOMER_API_SECURITY_ENABLED:true}
  onboarding:
    store-code: ${ONBOARDING_STORE_CODE:MCM-SEOUL}
  customer-session:
    cookie-secure: ${CUSTOMER_SESSION_COOKIE_SECURE:false}
    cookie-max-age: ${CUSTOMER_SESSION_COOKIE_MAX_AGE:604800}
  staff-session:
    cookie-secure: ${STAFF_SESSION_COOKIE_SECURE:false}
    cookie-max-age: ${STAFF_SESSION_COOKIE_MAX_AGE:31536000}
  mcm-studio:
    frame-overlay-urls:
      FRAME_1: ${MCM_STUDIO_FRAME_1_OVERLAY_URL:}
      FRAME_2: ${MCM_STUDIO_FRAME_2_OVERLAY_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
