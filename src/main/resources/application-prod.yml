spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT:30000}

  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.lionthanflower: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://mcm-orbit-n34.pages.dev}
  customer-session:
    cookie-secure: ${CUSTOMER_SESSION_COOKIE_SECURE:true}
    cookie-same-site: ${CUSTOMER_SESSION_COOKIE_SAME_SITE:None}
  staff-session:
    cookie-secure: ${STAFF_SESSION_COOKIE_SECURE:true}
    cookie-same-site: ${STAFF_SESSION_COOKIE_SAME_SITE:None}
